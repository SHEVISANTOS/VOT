<!DOCTYPE html><html><body>
<iframe id="f" src="index.html" style="width:1200px;height:900px;"></iframe>
<div id="result">not-run</div>
<script>
  const frame = document.getElementById('f');
  frame.addEventListener('load', () => {
    setTimeout(() => {
      try {
        const doc = frame.contentDocument;
        const win = frame.contentWindow;
        // scroll partway down first, like a real visitor browsing
        win.scrollTo({ top: 1200, behavior: 'auto' });
        setTimeout(() => {
          const scrollBefore = win.scrollY;
          const docHeight = doc.documentElement.scrollHeight;
          const btn = Array.from(doc.querySelectorAll('.placement-card__body a[href="#contact"]'))
            .find(a => a.textContent.trim() === 'Apply for healthcare');
          btn.click();
          setTimeout(() => {
            const overlay = doc.querySelector('.apply-modal');
            const scrollAfter = win.scrollY;
            document.getElementById('result').textContent =
              'docHeight=' + docHeight +
              '|scrollBefore=' + scrollBefore +
              '|scrollAfter=' + scrollAfter +
              '|modalOpen=' + overlay.classList.contains('is-open');
          }, 800);
        }, 400);
      } catch (e) {
        document.getElementById('result').textContent = 'ERR:' + e.message;
      }
    }, 700);
  });
</script>
</body></html>
