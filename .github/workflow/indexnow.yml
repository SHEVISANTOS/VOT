name: Automated IndexNow Ping

on:
  push:
    branches:
      - main  # Adjust if your default branch is 'master'

jobs:
  run-indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run IndexNow Script
        run: node scripts/indexnow.mjs