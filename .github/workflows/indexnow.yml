name: IndexNow

on:
  push:
    branches: [main]
    paths: ['**.html', 'sitemap.xml']
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Give Vercel time to finish deploying before search engines come crawling.
      - run: sleep 120
      - name: Submit changed pages
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: node scripts/indexnow.mjs --changed ${{ github.event.before }}
      - name: Submit full sitemap (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/indexnow.mjs
