<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page Not Found | Volunteers of Tanzania</title>
  <link rel="icon" type="image/jpeg" href="images/logo.jpeg">
  <link rel="apple-touch-icon" href="images/logo.jpeg">
  <meta name="theme-color" content="#0F3D46">
  <script>
    // Old or mistyped URLs (e.g. from Google) -> send visitors to the closest real page.
    (function () {
      var pages = [
        'accommodation', 'bmcc-day-care', 'bujora-cultural-museum', 'community',
        'conservation-lake-victoria', 'daycare-children', 'education', 'engineering',
        'geology', 'healthcare', 'kageye-historical-site', 'mass-communication',
        'mwanza-activities', 'mwanza-city-tour', 'our_team', 'prices',
        'safari-activities', 'saut-visit', 'serengeti-day-trip', 'tecec-early-childhood',
        'tour', 'ukerewe-island', 'wildlife-conservation', 'zanzibar'
      ];
      var slug = location.pathname.toLowerCase().split('/').pop().replace(/\.html?$/, '');
      var words = slug.split(/[^a-z0-9]+/).filter(function (w) { return w.length > 2; });
      var best = null, bestScore = 0;
      pages.forEach(function (p) {
        var score = 0;
        p.split(/[-_]/).forEach(function (w) { if (words.indexOf(w) !== -1) score++; });
        if (score > bestScore) { best = p; bestScore = score; }
      });
      if (best) location.replace('/' + best + '.html');
    })();
  </script>
  <style>
    :root { --teal: #0F3D46; --teal-deep: #082429; --ochre: #E8A33D; --sand: #F6EBD9; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; overflow-x: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--sand);
      background: linear-gradient(180deg, var(--teal-deep) 0%, var(--teal) 60%, #1d5a5f 100%);
    }

    /* Sunset scene */
    .scene { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .sun {
      position: absolute; left: 50%; bottom: 18vh; width: 260px; height: 260px; margin-left: -130px;
      border-radius: 50%;
      background: radial-gradient(circle, #FFD27A 0%, var(--ochre) 55%, rgba(232,163,61,0) 72%);
      animation: sunrise 1.6s ease-out both, glow 5s ease-in-out 1.6s infinite;
    }
    .land { position: absolute; left: 0; right: 0; bottom: 0; height: 22vh; }
    .bird { position: absolute; top: 18vh; left: -60px; width: 34px; animation: fly 16s linear infinite; }
    .bird--2 { top: 26vh; width: 24px; animation-duration: 21s; animation-delay: 5s; }
    .bird--3 { top: 14vh; width: 20px; animation-duration: 25s; animation-delay: 10s; }

    /* Content */
    .nf { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; padding: 64px 16px 30vh; text-align: center; }
    .logo {
      display: inline-block; width: 104px; height: 104px; border-radius: 50%; overflow: hidden;
      background: #fff; box-shadow: 0 0 0 6px rgba(246,235,217,0.15), 0 12px 30px rgba(0,0,0,0.35);
      animation: fadeUp 0.7s ease-out both, float 4s ease-in-out 0.7s infinite;
    }
    .logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .nf .code {
      margin: 28px 0 0; opacity: 1; animation: none; font: 800 clamp(72px, 20vw, 140px)/1 Georgia, "Times New Roman", serif;
      letter-spacing: 0.04em; color: var(--sand);
    }
    .code span { display: inline-block; animation: drop 0.8s cubic-bezier(.2,1.6,.4,1) both, bob 3s ease-in-out infinite; }
    .code span:nth-child(1) { animation-delay: 0.2s, 1.2s; }
    .code span:nth-child(2) { animation-delay: 0.35s, 1.5s; color: var(--ochre); }
    .code span:nth-child(3) { animation-delay: 0.5s, 1.8s; }
    h1 { margin: 12px 0 8px; font: 700 clamp(26px, 6vw, 36px)/1.2 Georgia, "Times New Roman", serif; animation: fadeUp 0.7s ease-out 0.6s both; }
    .nf p { margin: 0; opacity: 0.85; animation: fadeUp 0.7s ease-out 0.75s both; }
    .nf ul { list-style: none; padding: 0; margin: 28px 0 0; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .nf li { animation: fadeUp 0.5s ease-out both; }
    .nf li:nth-child(1) { animation-delay: 0.9s; }
    .nf li:nth-child(2) { animation-delay: 1.0s; }
    .nf li:nth-child(3) { animation-delay: 1.1s; }
    .nf li:nth-child(4) { animation-delay: 1.2s; }
    .nf li:nth-child(5) { animation-delay: 1.3s; }
    .nf li:nth-child(6) { animation-delay: 1.4s; }
    .nf li:nth-child(7) { animation-delay: 1.5s; }
    .nf li a {
      display: inline-block; padding: 10px 18px; border-radius: 999px;
      color: var(--sand); text-decoration: none; font-weight: 600;
      border: 1px solid rgba(246,235,217,0.35); background: rgba(8,36,41,0.35);
      transition: transform 0.2s, background 0.2s, color 0.2s;
    }
    .nf li a:hover, .nf li a:focus-visible { transform: translateY(-3px); background: var(--ochre); color: var(--teal-deep); border-color: var(--ochre); }
    .nf li:first-child a { background: var(--ochre); color: var(--teal-deep); border-color: var(--ochre); }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    @keyframes float { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-10px) rotate(3deg); } }
    @keyframes drop { from { opacity: 0; transform: translateY(-80px) scale(0.6); } to { opacity: 1; transform: none; } }
    @keyframes bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -8px; } }
    @keyframes sunrise { from { transform: translateY(140px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes glow { 0%, 100% { filter: brightness(1); scale: 1; } 50% { filter: brightness(1.15); scale: 1.05; } }
    @keyframes fly { from { transform: translateX(0); } to { transform: translateX(calc(100vw + 120px)); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>

    <svg class="bird bird--2" viewBox="0 0 40 14"><path d="M0 8 Q10 0 20 8 Q30 0 40 8" fill="none" stroke="#082429" stroke-width="2.5"/></svg>
    <svg class="bird bird--3" viewBox="0 0 40 14"><path d="M0 8 Q10 0 20 8 Q30 0 40 8" fill="none" stroke="#082429" stroke-width="2.5"/></svg>
    <!-- Savanna horizon with acacia trees -->
    <svg class="land" viewBox="0 0 1200 200" preserveAspectRatio="none">
      <path d="M0 80 Q300 40 600 70 T1200 60 V200 H0Z" fill="#082429"/>
      <g fill="#082429">
        <rect x="186" y="10" width="6" height="70"/>
        <ellipse cx="189" cy="12" rx="70" ry="14"/>
        <rect x="946" y="22" width="5" height="50"/>
        <ellipse cx="948" cy="24" rx="50" ry="10"/>
      </g>
    </svg>
  </div>

  <main class="nf">
    <a class="logo" href="index.html"><img src="images/logo.jpeg" alt="VOT Logo"></a>
    <p class="code" aria-hidden="true"><span>4</span><span>0</span><span>4</span></p>

</body>
</html>
