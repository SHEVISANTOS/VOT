<!DOCTYPE html><html><body>
<iframe id="f" src="index.html" style="width:1200px;height:900px;"></iframe>
<div id="result">not-run</div>
<script>
  const frame = document.getElementById('f');
  frame.addEventListener('load', () => {
    setTimeout(() => {
      try {
        const doc = frame.contentDocument;
        const btn = Array.from(doc.querySelectorAll('.placement-card__body a[href="#contact"]'))
          .find(a => a.textContent.trim() === 'Apply for healthcare');
        btn.click();
        setTimeout(() => {
          const overlay = doc.querySelector('.apply-modal');
          const select = overlay.querySelector('#program');
          document.getElementById('result').textContent =
            'modalOpen=' + overlay.classList.contains('is-open') +
            '|selectValue=' + (select ? select.value : 'MISSING');
        }, 400);
      } catch (e) {
        document.getElementById('result').textContent = 'ERR:' + e.message;
      }
    }, 700);
  });
</script>
</body></html>
