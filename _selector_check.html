<!DOCTYPE html><html><body>
<iframe id="f" src="index.html" style="width:1200px;height:900px;"></iframe>
<div id="result">not-run</div>
<script>
  const frame = document.getElementById('f');
  frame.addEventListener('load', () => {
    setTimeout(() => {
      const doc = frame.contentDocument;
      const contactLinks = doc.querySelectorAll('a[href="#contact"]').length;
      const smoothLinksExcludingContact = doc.querySelectorAll('a[href^="#"]:not([href="#contact"])').length;
      const smoothLinksIncludingContact = doc.querySelectorAll('a[href^="#"]').length;
      document.getElementById('result').textContent =
        'contactLinks=' + contactLinks +
        '|smoothExcl=' + smoothLinksExcludingContact +
        '|smoothIncl=' + smoothLinksIncludingContact +
        '|diffMatchesContactCount=' + (smoothLinksIncludingContact - smoothLinksExcludingContact === contactLinks);
    }, 700);
  });
</script>
</body></html>
